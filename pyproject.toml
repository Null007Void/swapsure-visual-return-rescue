[project]
name = "swapsure"
version = "1.7.15"
description = "SwapSure - visual return rescue: a shopper-consented wardrobe try-on with an always-available refund route"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13"]   # maintained decoder for provider result images

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
